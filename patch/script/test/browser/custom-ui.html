<!doctype html>
<meta charset="utf-8">
<title>custom ui harness</title>
<!-- Runs the Code node's sandboxed UI page (patch/board/ui/board-code-view.html) the way board-code.js does, in a sandboxed frame, and checks:
     the bleep API works (params, probes, buttons, size, errors, painting), the UI's code runs in a worker that can reach nothing it should not,
     and an endless loop in the UI's code is stopped without freezing anything.
     The UI's code runs in a worker, so it reports to this page through bleep.button("R:<json>") (a button press with a long id), which the frame
     relays like any other command.
     Run in a real browser: test/browser/run-custom-ui.sh (headless Chrome), or open /script/test/browser/custom-ui.html on the script-spike server. -->
<pre id="out">running…</pre>
<script type="module">
const results = { checks: [], messages: [] };
const check = (ok, what, detail = "") => results.checks.push({ ok: !!ok, what, detail });
const FRAME = "/board/ui/board-code-view.html";
const params = [
  { id: "drive", name: "Drive", kind: "float", min: 0, max: 20, steps: 0, label: "", default: 0.1 },
  { id: "shape", name: "Shape", kind: "choice", min: 0, max: 2, steps: 3, choices: ["A", "B", "C"], default: 0 },
];

/// Starts a frame with this source and collects its messages for `ms`. The UI's reports (bleep.button("R:{...}")) are parsed into .reports.
function run(source, { ms = 3000, onMessage = () => {}, sandbox = "allow-scripts" } = {}) {
  return new Promise((resolve) => {
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", sandbox);
    f.style.cssText = "width:400px;height:120px";
    const got = [];
    const listener = (e) => {
      if (e.source !== f.contentWindow) return;
      const m = e.data;
      got.push(m);
      if (m.t === "hello") f.contentWindow.postMessage({ t: "init", source, params, values: { drive: 0.1, shape: 0 }, probes: { level: 0.5 }, theme: { panel: "#252932", text: "#fff", accent: "#4fd1c5" } }, "*");
      onMessage(m, f);
    };
    window.addEventListener("message", listener);
    f.src = FRAME;
    document.body.append(f);
    setTimeout(() => {
      window.removeEventListener("message", listener); f.remove();
      got.reports = got.filter((m) => m.t === "command" && String(m.id).startsWith("R:")).map((m) => JSON.parse(m.id.slice(2)));
      resolve(got);
    }, ms);
  });
}
const REPORT = `const report = (o) => bleep.button("R:" + JSON.stringify(o));`;

try {
  // 1. the API: values in, settings out, size, buttons, state, probes, painting
  const api = await run(`${REPORT}
    const drive = bleep.param("drive"), shape = bleep.param("shape");
    report({ initial: drive.value, normalised: drive.normalised, choices: shape.choices.join(), probe: bleep.probe("level"), missing: bleep.probe("nope"), unit: shape.kind });
    drive.setNormalised(0.25); drive.set(10); shape.set(2);
    bleep.button("reset"); bleep.size(120);
    bleep.onValues(() => report({ later: true, drive: drive.value, level: bleep.probe("level") }));
    try { bleep.param("nope"); } catch (e) { report({ unknownParam: String(e.message) }); }
    let frames = 0; bleep.onFrame((dt) => { if (++frames === 3) report({ frames, dt: typeof dt }); });
    const c = bleep.canvas(80); report({ canvas: c.height, w: c.width > 0, g: typeof c.g.fillRect, el: typeof c.el.addEventListener });
    c.g.fillStyle = "#f00"; c.g.fillRect(0, 0, 10, 10);
    report({ frozen: Object.isFrozen(bleep), noFetchGlobal: typeof bleep.fetch });
  `, { onMessage: (m, f) => { if (m.t === "ready") setTimeout(() => f.contentWindow.postMessage({ t: "state", values: { drive: 0.5 }, probes: { level: 0.9 } }, "*"), 100); } });
  const reports = api.reports;
  const first = reports.find((r) => r.initial !== undefined) || {};
  check(Math.abs(first.initial - 2) < 1e-9 && first.normalised === 0.1, "a param reads in its own units (0.1 of 0..20 is 2)", JSON.stringify(first));
  check(first.choices === "A,B,C" && first.probe === 0.5 && first.missing === 0, "choices, probes, and 0 for an unknown probe");
  const sets = api.filter((m) => m.t === "set");
  check(sets.some((s) => s.id === "drive" && s.x === 0.25) && sets.some((s) => s.id === "drive" && s.units === 10) && sets.some((s) => s.id === "shape" && s.units === 2), "set and setNormalised reach the board", JSON.stringify(sets));
  check(api.some((m) => m.t === "command" && m.id === "reset"), "a button press reaches the board");
  check(api.some((m) => m.t === "size" && m.h === 120), "size() asks for a height");
  check(reports.some((r) => /no param 'nope'/.test(r.unknownParam || "")), "an unknown param is an error with the known ids");
  check(reports.some((r) => r.frames === 3 && r.dt === "number"), "onFrame runs every animation frame");
  check(reports.some((r) => r.canvas === 80 && r.w === true && r.g === "function" && r.el === "function"), "canvas() makes a canvas as wide as the view, with a 2D context and an element to listen on");
  check(api.some((m) => m.t === "painted"), "a frame drawn in the worker is painted by the page");
  const later = reports.find((r) => r.later);
  check(later && Math.abs(later.drive - 10) < 1e-9 && later.level === 0.9, "state from the board reaches onValues (drive 0.5 -> 10, probe 0.9)", JSON.stringify(later));
  check(reports.some((r) => r.frozen === true && r.noFetchGlobal === "undefined"), "the bleep object is frozen and has nothing beyond its API");

  // 2. errors come back with a line
  const bad = await run(`const x = 1;\nthrow new Error("boom");`);
  const err = bad.find((m) => m.t === "error");
  check(err && /boom/.test(err.message) && err.line === 2, "a thrown error is reported with its line", JSON.stringify(err));
  const unknown = await run(`bleep.param("zzz");`);
  check(unknown.some((m) => m.t === "error" && /no param 'zzz'/.test(m.message)), "a bad call is reported as an error");
  const late = await run(`bleep.onFrame(() => { throw new Error("in a frame"); });`);
  check(late.some((m) => m.t === "error" && /in a frame/.test(m.message)), "an error inside a frame callback is reported and stops the UI");
  const dom = await run(`document.body.append("x");`);
  check(dom.some((m) => m.t === "error" && /no DOM/.test(m.message)), "using the DOM says that a UI runs in a worker");

  // 3. the sandbox: the UI's code tries to get out
  const attack = await run(`${REPORT}
    const out = {}; const pending = [];
    const t = (name, fn) => { try { const r = fn(); out[name] = "ALLOWED:" + String(r).slice(0, 40); } catch (e) { out[name] = "blocked"; } };
    t("document", () => document.title);
    t("window", () => window.name);
    t("parent", () => parent.document.title);
    t("top", () => top.location.href);
    t("localStorage", () => localStorage.getItem("a"));
    t("cookie", () => document.cookie);
    t("indexedDB", () => indexedDB.open("x"));
    t("caches", () => caches.open("x"));
    t("WebSocket", () => new WebSocket("ws://127.0.0.1:1"));
    t("EventSource", () => new EventSource("/"));
    t("Worker", () => new Worker("data:text/javascript,postMessage(1)"));
    t("importScripts", () => importScripts("data:text/javascript,1"));
    t("serviceWorker", () => navigator.serviceWorker.register("/sw.js"));
    t("fetchName", () => fetch("/"));
    t("xhrName", () => new XMLHttpRequest());
    // forging a message to the page: only the page's own message types get through, a made-up one is dropped
    t("forge", () => { self.postMessage({ t: "set", id: "drive", x: 0.77 }); self.postMessage({ t: "navigate", url: "/?escaped" }); return "posted"; });
    pending.push(Promise.resolve().then(() => fetch("/", { credentials: "include" })).then(() => { out.fetch = "ALLOWED"; }, () => { out.fetch = "blocked"; }));
    pending.push(new Promise((res) => { try { const b = URL.createObjectURL(new Blob(["1"], { type: "text/javascript" })); import(b).then(() => { out.importBlob = "ALLOWED"; res(); }, () => { out.importBlob = "blocked"; res(); }); } catch (e) { out.importBlob = "blocked"; res(); } }));
    Promise.all(pending).then(() => report({ attack: out }));
  `, { ms: 3000 });
  const attackReport = (attack.reports.find((r) => r.attack) || {}).attack || {};
  for (const name of ["document", "window", "parent", "top", "localStorage", "cookie", "indexedDB", "caches", "WebSocket", "EventSource", "Worker", "importScripts", "serviceWorker", "fetchName", "xhrName", "fetch", "importBlob"])
    check(attackReport[name] === "blocked", `sandbox: ${name} is blocked`, attackReport[name] || "no answer");
  check(attack.filter((m) => m.t === "hello").length === 1, "sandbox: the frame did not navigate", String(attack.filter((m) => m.t === "hello").length));
  check(attack.some((m) => m.t === "set" && m.id === "drive" && m.x === 0.77) && !attack.some((m) => m.t === "navigate"), "a forged message of the protocol is just another set (the board checks it), a made-up one is dropped");
  results.attack = attackReport;

  // 4. an endless loop is stopped and nothing else freezes
  let ticks = 0, worst = 0, lastTick = performance.now();
  const timer = setInterval(() => { const now = performance.now(); worst = Math.max(worst, now - lastTick); lastTick = now; ticks++; }, 50);
  const t0 = performance.now();
  const hangFrame = await run(`bleep.canvas(40); let n = 0; bleep.onFrame(() => { if (++n === 5) for (;;) {} });`, { ms: 5000 });
  const stoppedAt = hangFrame.find((m) => m.t === "error");
  check(stoppedAt && /stopped answering/.test(stoppedAt.message), "an endless loop in a frame callback is stopped and reported", JSON.stringify(stoppedAt));
  const hangStart = await run(`for (;;) {}`, { ms: 6000 });
  const startError = hangStart.find((m) => m.t === "error");
  check(startError && /did not start in time/.test(startError.message), "an endless loop at the top of the code is stopped and reported", JSON.stringify(startError));
  clearInterval(timer);
  check(worst < 400, "this page kept running while the UI hung (longest gap between timers, ms)", String(Math.round(worst)));
  results.timing = { ticks, worst, seconds: Math.round(performance.now() - t0) / 1000 };

  // 5. pointer events reach the UI (the frame forwards them; here a synthetic event is dispatched by the frame itself is not possible from outside,
  //    so test/browser/ui-chrome.mjs drives a real mouse through the DevTools protocol and checks the knob values)
} catch (e) {
  check(false, "the harness itself failed", String(e && e.stack || e));
}
const failed = results.checks.filter((c) => !c.ok);
document.getElementById("out").textContent = JSON.stringify({ failed: failed.length, total: results.checks.length, checks: results.checks, attack: results.attack, timing: results.timing }, null, 1);
try { await fetch("/result", { method: "POST", body: JSON.stringify({ failed: failed.length, total: results.checks.length, checks: results.checks, attack: results.attack }) }); } catch (e) {}
document.title = failed.length ? "FAILED " + failed.length : "PASSED " + results.checks.length;
</script>
