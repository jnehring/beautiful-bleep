<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- The Bleep Board (spec §9). Files from board/ui, common/ui and modules/*/ui are
     served side by side, both in the plugin and by scripts/ui-server.py. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bleep Board</title>
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="bleep-view.css">
</head>
<body>
  <header id="top">
    <span id="sections" class="sections" hidden>
      <button id="sec-board" class="on" title="Create patches">Board</button>
      <button id="sec-store" title="Modules, plugins and presets on this machine">Store</button>
    </span>
    <nav id="crumbs" aria-label="Location"></nav>
    <button id="add" title="Add a module (Tab)">Add <kbd>⇥</kbd></button>
    <button id="panels" title="Panels (P)">Panels</button>
    <button id="presets" title="Browse demo patches and your own (⌘P in the app)">Presets</button>
    <span class="spacer"></span>
    <button id="undo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M5.5 3 2.5 6l3 3"/><path d="M3 6h6.5a4 4 0 0 1 0 8H6"/></svg></button>
    <button id="redo" title="Redo (⌘⇧Z)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="M10.5 3l3 3-3 3"/><path d="M13 6H6.5a4 4 0 0 0 0 8H10"/></svg></button>
    <span id="status"></span>
  </header>
  <div id="main">
    <div id="canvas" tabindex="0">
      <div id="world">
        <svg id="cables"></svg>
        <div id="nodes"></div>
      </div>
      <div id="band" hidden></div>
      <div id="empty" hidden></div>
      <div id="views"></div>
      <button id="cell-close" hidden title="Leave the cell (Esc)">Close cell ×</button>
      <div id="cable-pop" class="popover" hidden></div>
      <div id="menu" class="popover" hidden></div>
      <div id="search" class="popover" hidden>
        <input id="search-input" placeholder="Search modules and cells" spellcheck="false" autocomplete="off">
        <div id="search-list"></div>
        <div id="search-hint" hidden></div>
      </div>
      <div id="hint"></div>
    </div>
  </div>
  <script src="bleep-bridge.js"></script>
  <script src="board-demo.js"></script>
  <script src="bleep-view.js"></script>
  <script src="bleep-markdown.js"></script>
  <script src="function.js"></script>
  <script src="lfo.js"></script>
  <script src="filter.js"></script>
  <script src="step-sequencer.js"></script>
  <script src="quantizer.js"></script>
  <script src="drum-grid-patterns.js"></script>
  <script src="drum-grid.js"></script>
  <script src="dial.js"></script>
  <script src="button.js"></script>
  <script src="keyboard.js"></script>
  <script src="level-meter.js"></script>
  <script src="audio-mixer.js"></script>
  <script src="devices.js"></script>
  <script src="panels.js"></script>
  <script src="panel-editor.js"></script>
  <script src="panel-build.js"></script>
  <script src="factory-presets.js"></script>
  <script src="preset-browser.js"></script>
  <script src="store.js"></script>
  <script src="board.js"></script>
</body>
</html>
