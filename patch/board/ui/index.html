<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only WITH AdditionRef-Bleep-Module-Exception -->
<!-- The board (spec §9). Files from board/ui, common/ui and modules/*/ui are
     served side by side, both in the plugin and by scripts/ui-server.py. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only the directives that do not depend on the page's origin (juce://juce.backend on macOS and Linux, https://juce.backend on
       Windows): the board has no frames, plugins, forms or <base>, so these cannot break loading. They keep a module view from adding
       a frame (a frame would be a second window that has the platform's message channel). The browser build adds its full policy
       (scripts/build/build-web.sh); a script-src for the app is left out until it is tried in each web view. -->
  <meta http-equiv="Content-Security-Policy" content="frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Play</title>
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="bleep-view.css">
</head>
<body>
  <header id="top">
    <nav id="crumbs" aria-label="Location"></nav>
    <span class="spacer"></span>
    <button id="audio" class="audio" title="Audio" aria-label="Audio status"><span class="dot"></span></button>
  </header>
  <div id="main">
    <button id="side-toggle" class="side-toggle" title="Menu: connect, transport, preset" aria-label="Menu" aria-controls="side-menu" aria-expanded="false" hidden><svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
    <div id="canvas" tabindex="0">
      <div id="world">
        <svg id="cables"></svg>
        <div id="nodes"></div>
      </div>
      <div id="band" hidden></div>
      <div id="empty" hidden></div>
      <div id="views"></div>
      <div id="navbar" role="toolbar" aria-label="Move and zoom the board">
        <button data-nav="zoom-in" title="Zoom in (+ · ⌘ scroll up)" aria-label="Zoom in">+</button>
        <button data-nav="zoom-out" title="Zoom out (− · ⌘ scroll down)" aria-label="Zoom out">&minus;</button>
        <span class="nav-sep"></span>
        <button data-nav="left" title="Move left (← · scroll · Space-drag)" aria-label="Move left">&larr;</button>
        <button data-nav="up" title="Move up (↑ · scroll · Space-drag)" aria-label="Move up">&uarr;</button>
        <button data-nav="down" title="Move down (↓ · scroll · Space-drag)" aria-label="Move down">&darr;</button>
        <button data-nav="right" title="Move right (→ · scroll · Space-drag)" aria-label="Move right">&rarr;</button>
      </div>
      <button id="cell-close" hidden title="Leave the cell (Esc)">Close cell ×</button>
      <div id="cable-pop" class="popover" hidden></div>
      <div id="help-pop" class="popover" hidden></div>
      <div id="menu" class="popover" hidden></div>
      <div id="search" class="popover" hidden>
        <input id="search-input" placeholder="Search modules and cells" spellcheck="false" autocomplete="off">
        <div id="search-list"></div>
        <div id="search-hint" hidden></div>
      </div>
    </div>
  </div>
  <script src="bleep-bridge.js"></script>
  <script src="board-demo.js"></script>
  <script src="bleep-view-presets.js"></script>
  <script src="bleep-view.js"></script>
  <script src="bleep-markdown.js"></script>
  <script src="bleep-credits.js"></script>
  <script src="bleep-media.js"></script>
  <script src="function.js"></script>
  <script src="lfo.js"></script>
  <script src="filter.js"></script>
  <script src="step-sequencer.js"></script>
  <script src="quantizer.js"></script>
  <script src="drum-grid-patterns.js"></script>
  <script src="drum-grid.js"></script>
  <script src="dial.js"></script>
  <script src="button.js"></script>
  <script src="keyboard.js"></script>
  <script src="level-meter.js"></script>
  <script src="audio-mixer.js"></script>
  <script src="live-params.js"></script>
  <script src="board-code-widgets.js"></script>
  <script src="board-code-share.js"></script>
  <script src="board-code.js"></script>
  <script src="panel-wiring.js"></script>
  <script src="panels.js"></script>
  <script src="panel-editor.js"></script>
  <script src="panel-build.js"></script>
  <script src="factory-presets.js"></script>
  <script src="preset-index.js"></script>
  <script src="play-wrap.js"></script>
  <script src="play-keys.js"></script>
  <script src="play-source.js"></script>
  <script src="project-browser.js"></script>
  <script src="account.js"></script>
  <script src="modal.js"></script>
  <script src="side-menu.js"></script>
  <script src="app-menu.js"></script>
  <script src="library.js"></script>
  <script src="select-menu.js"></script>
  <script src="settings.js"></script>
  <script src="help.js"></script>
  <script src="board-model.js"></script>
  <script src="board-render.js"></script>
  <script src="board-canvas.js"></script>
  <script src="board-menus.js"></script>
  <script src="board-cabledrag.js"></script>
  <script src="board-cabletools.js"></script>
  <script src="board-edit.js"></script>
  <script src="board-cells.js"></script>
  <script src="board-views.js"></script>
  <script src="board-panels.js"></script>
  <script src="board-search.js"></script>
  <script src="board-presets.js"></script>
  <script src="agent-chat.js"></script>
  <script src="board.js"></script>
</body>
</html>
