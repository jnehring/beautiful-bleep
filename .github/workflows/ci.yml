# SPDX-License-Identifier: MIT
name: CI

# DISABLED to save Actions minutes: no trigger. Re-enable by restoring the triggers:
#   push:
#     branches: [main]
#   pull_request:
on: {}

jobs:
  rules:
    name: Repository rules and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check/check-repo.py
      - run: python3 -m pip install cryptography
      - run: python3 -m unittest test_release test_signing
        working-directory: scripts/release
      - run: python3 scripts/check/check-api-docs.py
      - run: node patch/presets/build.mjs --check
      - run: python3 scripts/docs/build-docs.py --out build/docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-single-files
          path: build/docs

  docker-site:
    name: Website container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f website/docker-compose.yml build

  bus:
    name: Bus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S bus -B build/bus -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/bus --config Release
      - run: ctest --test-dir build/bus -C Release --output-on-failure

  patch-dsp:
    name: Patch DSP tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S patch -B build/patch -DBLEEP_PATCH_BUILD_PLUGINS=OFF
      - run: cmake --build build/patch
      - run: ctest --test-dir build/patch --output-on-failure

  web:
    name: Bleep Board in the browser (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build/build-web.sh build/web/site
      - run: node patch/web/test/graph-test.mjs build/web/site
      - uses: actions/upload-artifact@v4
        with:
          name: bleep-board-web
          path: build/web/site

  plugins:
    name: Plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: bleep-patch-${{ matrix.os }}
          path: |
            build/patch/*_artefacts/Release/VST3
            build/patch/*_artefacts/Release/Standalone

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: website/app
      - run: npm run build
        working-directory: website/app
      # Deployment to the Brilliant Bleep server is added once the domain is decided.
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/app/out
