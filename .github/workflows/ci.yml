# SPDX-License-Identifier: MIT
name: CI

# DISABLED to save Actions minutes: manual runs only (Actions tab -> Run workflow).
# (`on: {}` is invalid and makes GitHub record a failed run on every push.)
# Re-enable by replacing `workflow_dispatch:` with the triggers:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  rules:
    name: Repository rules and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/check/check-repo.py
      - run: python3 -m pip install cryptography==50.0.2
      - run: python3 -m unittest test_release test_signing test_package_module test_community_publish
        working-directory: scripts/release
      - run: node patch/web/test/library-client-test.mjs
      - run: node patch/web/test/module-versions-test.mjs
      - run: node patch/web/test/web-settings-test.mjs
      - run: node patch/web/test/board-code-test.mjs
      - run: node patch/web/test/user-modules-test.mjs
      - run: node patch/web/test/bleepmod-test.mjs
      - run: npm ci --no-audit --no-fund
        working-directory: patch/script
      - run: npm test
        working-directory: patch/script
      - run: python3 scripts/check/check-api-docs.py
      - run: node patch/presets/build.mjs --check
      - run: node patch/presets/build-modules.mjs --check
      - run: node patch/presets/build-docs.mjs --check
      - run: node patch/web/test/build-docs-test.mjs
      - run: python3 scripts/docs/build-docs.py --out build/docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-single-files
          path: build/docs

  docker-site:
    name: Website container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker compose -f website/docker-compose.yml build

  bus:
    name: Bus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cmake -S bus -B build/bus -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/bus --config Release
      - run: ctest --test-dir build/bus -C Release --output-on-failure

  patch-dsp:
    name: Patch DSP tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cmake -S patch -B build/patch -DBLEEP_BUILD_PLUGINS=OFF
      - run: cmake --build build/patch
      - run: ctest --test-dir build/patch --output-on-failure

  web:
    name: Bleep Play (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 4.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund && npm run bundle
        working-directory: patch/script
      - run: scripts/build/build-web.sh build/web/site
      - run: node patch/web/test/graph-test.mjs build/web/site
      - run: node patch/web/test/patchbay-test.mjs
      - run: node patch/web/test/panel-wiring-test.mjs
      - run: node patch/web/test/bridge-seal-test.mjs
      - run: node patch/web/test/markdown-test.mjs
      - run: node patch/web/test/credits-test.mjs
      - run: node patch/web/test/preset-index-test.mjs
      - run: node patch/web/test/media-test.mjs
      - run: node patch/web/test/play-wrap-test.mjs
      - run: node patch/web/test/audio-input-test.mjs
      - run: node patch/web/test/voices-test.mjs build/web/site
      - run: node patch/web/test/play-presets-test.mjs build/web/site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bleep-board-web
          path: build/web/site

  plugins:
    name: Plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beautiful-bleep-${{ matrix.os }}
          path: |
            build/patch/*_artefacts/Release/VST3
            build/patch/*_artefacts/Release/Standalone

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: website/app
      - run: npm run build
        working-directory: website/app
      # Deployment to the Brilliant Bleep server is added once the domain is decided.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website
          path: website/app/out
