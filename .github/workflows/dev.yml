# SPDX-License-Identifier: MIT
#
# Dev builds: every push to main is tested, built and released into the library's dev channel (doc/operations/dev-builds.md).
# Accounts with dev access install them from Bleep App (Settings -> Library -> Channel: dev); with "Install module updates
# automatically" a running Ableton Live picks up a new module within a minute.
#
# As much as possible runs on our own Linux server, in the ephemeral build runner container (ci/runner): the tests, the modules (WebAssembly, the same for
# every system) and the Linux plugins and app. Only what needs another operating system is built on GitHub's runners, at the same
# time, and added to the release the server made once it is there: macOS and Windows. The version is 1.4.4-dev.<commit time>: every machine works that out from
# the commit, so the three builds of one commit end up in one release (scripts/release/release.py, --dev).
#
# Setup: Settings -> Environments -> New environment "dev" (no reviewers: this must run by itself), with the variable
# BLEEP_REGISTRY_URL (the website's https address) and the secret BLEEP_DEV_TOKEN, a release token that may only release into
# the dev channel:  docker compose exec api python -m app.cli token-create ci-dev --channels dev
# The secrets are only handed to the release step, never to the build, which compiles other people's code (JUCE, Link).
name: Dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One build at a time; a newer push waits for the running one instead of cutting a release in half. Of several waiting,
# only the newest runs.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  server:
    name: Linux server (tests, modules, Linux plugins)
    runs-on: [self-hosted, bleep-build]   # ci/runner: a container with the toolchain, one job each, no access to Docker or the server
    environment: dev
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 6   # compilers at a time: the container has 12 GB, and the JUCE sources need about 1.5 GB each
      # The strict warning flags of the project (JUCE's recommended set) print thousands of lines for the DSP code; a build here
      # is judged by its errors. A build on your own machine still shows the warnings.
      CCACHE_MAXSIZE: 15G   # the default 5 GB is less than one full build; the cache is what makes the next build short
      BLEEP_LTO: "0"   # no link-time optimisation: GCC links each plugin serially for minutes; a dev build does not need it
      CFLAGS: -w
      CXXFLAGS: -w
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: ./bleep test js presets
      - name: Native tests
        # The demo patches are timed: the server renders six shards side by side on shared cores, so "too slow" here means slower than real time
        env:
          BLEEP_DEMO_CPU_LIMIT: "1.0"
        run: ./bleep test native
      # The build rewrites the generated type list; a difference means the committed copy was stale.
      - name: demo-types.json is current
        run: git diff --exit-code -- patch/board/ui/demo-types.json
      # The modules written in Bleep Script (AssemblyScript) are compiled with node; without the packages they are skipped.
      - name: Bleep Script compiler (npm packages)
        working-directory: patch/script
        run: npm ci --no-audit --no-fund
      - name: Build the modules
        # The build is incremental (patch/web/build_modules.py hashes each module's sources), but the checkout is new every time. The
        # output lives on the cache volume instead, one folder per Emscripten and JUCE version, so only changed modules are compiled.
        run: |
          cache=/cache/modules-$( (emcc --version | head -n 1; git -C "$BLEEP_JUCE_DIR" rev-parse HEAD) | sha256sum | cut -c1-12)
          mkdir -p "$cache" build/web
          ln -sfn "$cache" build/web/modules
          ./bleep build modules
      # With Wasmtime the plugins and the app load the modules as .wasm from the library (like on a developer's machine) and carry no
      # module code: far fewer sources to compile, and the Library section and the automatic module updates work.
      - name: Wasmtime (the wasm module host)
        run: scripts/build/fetch-wasmtime.sh
      - name: Build the plugins and the app
        run: ./bleep build plugins --plugins-only --no-install
      - name: Release modules and plugins into the dev channel
        env:
          BLEEP_REGISTRY_URL: ${{ vars.BLEEP_REGISTRY_URL }}
          BLEEP_RELEASE_TOKEN: ${{ secrets.BLEEP_DEV_TOKEN }}
        run: |
          # unchanged modules are skipped; the plugins of this commit are released once (a re-run is a no-op)
          ./bleep release modules --dev --no-build -y
          python3 scripts/release/release.py --all --dev --yes

  other-systems:
    name: Plugins (${{ matrix.os }})
    # No `needs: server`: these builds need nothing from it (with Wasmtime the plugins carry no modules), so they run beside it. Only
    # the last step waits for the server job, whose release this build is added to.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: dev
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read   # the last step reads the result of the server job
    env:
      BLEEP_LTO: "0"   # as on the server: no link-time optimisation in a dev build
      CCACHE_MAXSIZE: 800M   # GitHub keeps 10 GB of caches per repository; every run saves one
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The compiler cache survives from one run to the next in GitHub's cache (the server keeps its own on /cache): the JUCE modules and
      # the engine are compiled once, a later run only compiles what changed.
      - name: ccache
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ccache; else choco install ccache ninja --no-progress -y; fi
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-
      - name: Wasmtime (the wasm module host)
        shell: bash
        run: scripts/build/fetch-wasmtime.sh
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CFLAGS: -w
          CXXFLAGS: -w
        run: ./bleep build plugins --plugins-only --no-install
      - name: WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # JUCE links the board's web view against the WebView2 NuGet package and looks for it by this location
          nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$RUNNER_TEMP/webview2"
          echo "WEBVIEW2_DIR=$(cygpath -m "$RUNNER_TEMP/webview2")" >> "$GITHUB_ENV"
      # Ninja instead of the Visual Studio generator (which cannot use ccache); the compiler needs the Visual Studio environment
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # BLEEP_BUILD_TESTS=OFF like ./bleep build plugins: the tests ran on the server, and each of the ~25 test programs compiled the engine again
          cmake -S patch -B build/patch -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBLEEP_FORMATS=VST3 -DBLEEP_BUILD_TESTS=OFF -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$WEBVIEW2_DIR"
          # -k 0: go on after an error, so one run shows every file that does not compile
          cmake --build build/patch --parallel -- -k 0
          ccache --show-stats
      # The release of this commit is made by the server job (the Linux plugins, after the tests passed); this build is added to it.
      - name: Wait for the server job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 120); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.name | startswith("Linux server")) | .conclusion // "pending"][0]')
            case "$result" in
              success) exit 0 ;;
              pending) sleep 30 ;;
              *) echo "The server job ended with: $result. Nothing is released for this commit, so this build is not added."; exit 1 ;;
            esac
          done
          echo "The server job did not finish in an hour."; exit 1
      - name: Add this system to the dev build of the commit
        shell: bash
        env:
          BLEEP_REGISTRY_URL: ${{ vars.BLEEP_REGISTRY_URL }}
          BLEEP_RELEASE_TOKEN: ${{ secrets.BLEEP_DEV_TOKEN }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release/release.py --all --dev --add-platform latest --yes
