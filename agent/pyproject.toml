# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bleep-agent"
version = "0.1.0"
description = "The Bleep patch assistant: catalog, patch model, tools and agent loop (Pydantic AI)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-ai-slim[google,openai]>=2,<3",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bleep-agent = "bleep_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bleep_agent = ["prompts/*.md", "evals/prices.yaml", "evals/rubrics/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
