# Price table for cost reports: US dollars per 1,000,000 tokens. Keys are model names without the provider prefix.
# `null` = not set: reports then show tokens and "n/a" instead of inventing a cost. Fill in from the providers' price lists
# on the day of a run; the table's version is stored in every run so numbers stay comparable.
version: 1
currency: USD
models:
  gemini-3.8-flash: {input: 0.75, cached_input: 0.075, output: 3.75}
  gpt-6-luna: {input: 0.1, cached_input: 0.01, output: 0.50}
  gemini-4-argon: {input: 2, cached_input: 0.1, output: 10}
  qwen3.8-flash: {input: 0.15, cached_input: null, output: 0.47}
embeddings:
  gemini-embedding-2: {input: 0.2}
