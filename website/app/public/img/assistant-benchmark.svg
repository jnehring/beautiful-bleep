<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">How the benchmark runs</title>
  <desc id="d">Cases for six skills run through a harness. The harness calls the real agent loop with a simulated browser that answers the live tools and applies the changesets, and every model call goes through a replay cache. Deterministic checks and an optional judge score each run. Results and full logs land in a run folder. The lab notebook lists the versions of the assistant with their run folders, and the compare command writes compare.md from them.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .name { font-size: 14px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .link { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: var(--accent); }
  </style>
  <rect width="760" height="400" rx="14" fill="var(--bg)"/>

  <!-- row 1 -->
  <rect class="box" x="20" y="24" width="190" height="84" rx="10"/>
  <text class="name" x="115" y="50">Cases</text><text class="sub" x="115" y="70">187 YAML cases, 6 skills</text><text class="sub" x="115" y="86">generated + hand-written</text>
  <rect class="hub" x="285" y="24" width="190" height="84" rx="10"/>
  <text class="name" x="380" y="50">Harness</text><text class="sub" x="380" y="70">real agent loop, simulated</text><text class="sub" x="380" y="86">browser approves changes</text>
  <rect class="box" x="550" y="24" width="190" height="84" rx="10"/>
  <text class="name" x="645" y="50">Model</text><text class="sub" x="645" y="70">through a replay cache:</text><text class="sub" x="645" y="86">same request, no new cost</text>
  <path class="link" d="M210 66 H277"/><path class="head" d="M285 66 l-10 -6 v12 z"/>
  <path class="link" d="M475 58 H542"/><path class="head" d="M550 58 l-10 -6 v12 z"/>
  <path class="link" d="M550 82 H483"/><path class="head" d="M475 82 l10 -6 v12 z"/>

  <!-- row 2 -->
  <rect class="box" x="20" y="164" width="320" height="84" rx="10"/>
  <text class="name" x="180" y="190">Score each run</text><text class="sub" x="180" y="210">checks in code decide pass or fail</text><text class="sub" x="180" y="226">an optional judge model rates the answer</text>
  <rect class="hub" x="420" y="164" width="320" height="84" rx="10"/>
  <text class="name" x="580" y="190">Run folder</text><text class="sub" x="580" y="210">results.jsonl, report.md,</text><text class="sub" x="580" y="226">full logs of every model and tool call</text>
  <path class="link" d="M380 108 V136 H180 V156"/><path class="head" d="M180 164 l-6 -10 h12 z"/>
  <path class="link" d="M340 206 H412"/><path class="head" d="M420 206 l-10 -6 v12 z"/>

  <!-- row 3 -->
  <rect class="box" x="20" y="304" width="320" height="72" rx="10"/>
  <text class="name" x="180" y="330">Lab notebook</text><text class="sub" x="180" y="350">versions: name, run folder, what changed</text>
  <rect class="hub" x="420" y="304" width="320" height="72" rx="10"/>
  <text class="name" x="580" y="330">compare.md</text><text class="sub" x="580" y="350">side by side: success, cost, speed, per case</text>
  <path class="link" d="M580 248 V296"/><path class="head" d="M580 304 l-6 -10 h12 z"/>
  <path class="link" d="M340 340 H412"/><path class="head" d="M420 340 l-10 -6 v12 z"/>
</svg>
