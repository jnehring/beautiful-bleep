<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d">
  <title id="t">The chain of trust</title>
  <desc id="d">Four steps, each certifying the next: the offline root key, certified online issuer key, per-developer key, and finally the signature over one package.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .sep { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { font-size: 18px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 13px; fill: var(--muted); text-anchor: middle; }
    .l { text-anchor: start; }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--line); stroke-width: 2; fill: none; }
    .head { fill: var(--accent); }
    .cap { font-size: 13px; font-weight: 600; text-anchor: middle; }
  </style>
  <rect width="760" height="320" rx="14" fill="var(--bg)"/>

  <rect class="hub" x="24" y="16" width="580" height="58" rx="12"/>
  <text class="name l" x="44" y="40">Root key</text>
  <text class="sub l" x="44" y="60">offline, held by Brilliant Bleep; its public key is built into every app and plugin</text>

  <path class="link" d="M48 74 V121 H58"/><path class="head" d="M64 121 l-10 -6 v12 z"/>
  <rect class="box" x="64" y="92" width="580" height="58" rx="12"/>
  <text class="name l" x="84" y="116">Issuer key</text>
  <text class="sub l" x="84" y="136">online, in the store; certified by the root; valid for years, revocable</text>

  <path class="link" d="M88 150 V197 H98"/><path class="head" d="M104 197 l-10 -6 v12 z"/>
  <rect class="box" x="104" y="168" width="580" height="58" rx="12"/>
  <text class="name l" x="124" y="192">Developer key</text>
  <text class="sub l" x="124" y="212">one per developer or team, made on their own machine; certified by the issuer</text>

  <path class="link" d="M128 226 V273 H138"/><path class="head" d="M144 273 l-10 -6 v12 z"/>
  <rect class="hub" x="144" y="244" width="580" height="58" rx="12"/>
  <text class="name l" x="164" y="268">Signature</text>
  <text class="sub l" x="164" y="288">over one package: a module, or one platform file of a plugin</text>
</svg>
