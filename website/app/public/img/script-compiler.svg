<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
  <title id="t">The module pipeline</title>
  <desc id="d">The script and the library sources are parsed by asc. The Bleep transform checks the subset, reads the decorators and adds a generated entry file. asc then compiles and Binaryen optimises, which gives module.wasm. The transform also produces the node description, and compile errors go back to the editor as problems.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .group { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { font-size: 16px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
    .cap { font-size: 13px; font-weight: 600; fill: var(--muted); }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: var(--accent); }
  </style>
  <rect width="760" height="260" rx="14" fill="var(--bg)"/>

  <rect class="box" x="30" y="40" width="120" height="70" rx="12"/>
  <text class="name" x="90" y="72">Source</text>
  <text class="sub" x="90" y="92">script and bleep/*</text>
  <rect class="box" x="175" y="40" width="120" height="70" rx="12"/>
  <text class="name" x="235" y="72">Parse</text>
  <text class="sub" x="235" y="92">asc, in memory</text>
  <rect class="hub" x="320" y="40" width="120" height="70" rx="12"/>
  <text class="name" x="380" y="72">Transform</text>
  <text class="sub" x="380" y="92">afterParse</text>
  <rect class="box" x="465" y="40" width="120" height="70" rx="12"/>
  <text class="name" x="525" y="72">Compile</text>
  <text class="sub" x="525" y="92">asc, Binaryen</text>
  <rect class="hub" x="610" y="40" width="120" height="70" rx="12"/>
  <text class="name" x="670" y="72">module.wasm</text>
  <text class="sub" x="670" y="92">no imports</text>

  <path class="link" d="M150 75 H167"/><path class="head" d="M175 75 l-10 -6 v12 z"/>
  <path class="link" d="M295 75 H312"/><path class="head" d="M320 75 l-10 -6 v12 z"/>
  <path class="link" d="M440 75 H457"/><path class="head" d="M465 75 l-10 -6 v12 z"/>
  <path class="link" d="M585 75 H602"/><path class="head" d="M610 75 l-10 -6 v12 z"/>

  <path class="link" d="M380 110 V158"/><path class="head" d="M380 166 l-6 -10 h12 z"/>
  <rect class="box" x="290" y="166" width="180" height="70" rx="12"/>
  <text class="name" x="380" y="196">Node description</text>
  <text class="sub" x="380" y="216">jacks, knobs, meters (JSON)</text>

  <path class="link" d="M525 110 V158"/><path class="head" d="M525 166 l-6 -10 h12 z"/>
  <text class="cap" x="535" y="146">errors</text>
  <rect class="box" x="500" y="166" width="140" height="70" rx="12"/>
  <text class="name" x="570" y="196">Problems</text>
  <text class="sub" x="570" y="216">markers in the editor</text>

  <text class="sub" x="380" y="26" text-anchor="middle" style="text-anchor:middle">The transform checks the subset, reads the decorators and adds the generated entry file</text>
</svg>
