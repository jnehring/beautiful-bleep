<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">How the assistant finds documentation</title>
  <desc id="d">At build time the documentation pages are split by heading into chunks of at most 450 tokens, each chunk gets a keyword index entry and an embedding, and both go into one SQLite file. At question time the question runs a keyword search and a vector search, the two rankings are merged by reciprocal rank fusion, the top six chunks go to the model, and it answers with links to the pages it used.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .gt { font-size: 13px; font-weight: 700; }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .name { font-size: 14px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .link { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: var(--accent); }
  </style>
  <rect width="760" height="360" rx="14" fill="var(--bg)"/>

  <!-- build time -->
  <rect class="group" x="16" y="14" width="728" height="140" rx="12"/>
  <text class="gt" x="30" y="36">Build time (scripts/build/build-agent-data.sh)</text>
  <rect class="box" x="30" y="50" width="150" height="86" rx="10"/>
  <text class="name" x="105" y="76">Pages</text><text class="sub" x="105" y="96">website/content</text><text class="sub" x="105" y="112">module manuals</text>
  <rect class="box" x="226" y="50" width="170" height="86" rx="10"/>
  <text class="name" x="311" y="76">Chunks</text><text class="sub" x="311" y="96">split by heading,</text><text class="sub" x="311" y="112">max 450 tokens, path kept</text>
  <rect class="box" x="442" y="50" width="130" height="38" rx="10"/>
  <text class="name" x="507" y="74">FTS5 keywords</text>
  <rect class="box" x="442" y="98" width="130" height="38" rx="10"/>
  <text class="name" x="507" y="122">Embeddings</text>
  <rect class="hub" x="610" y="50" width="120" height="86" rx="10"/>
  <text class="name" x="670" y="86">docs.sqlite</text><text class="sub" x="670" y="106">one file</text>
  <path class="link" d="M180 93 H218"/><path class="head" d="M226 93 l-10 -6 v12 z"/>
  <path class="link" d="M396 93 H410 V69 H434"/><path class="head" d="M442 69 l-10 -6 v12 z"/>
  <path class="link" d="M396 93 H410 V117 H434"/><path class="head" d="M442 117 l-10 -6 v12 z"/>
  <path class="link" d="M572 69 H590 V93 H602"/><path class="head" d="M610 93 l-10 -6 v12 z"/>
  <path class="link" d="M572 117 H590 V93"/>

  <!-- question time -->
  <rect class="group" x="16" y="176" width="728" height="168" rx="12"/>
  <text class="gt" x="30" y="198">Question time (the docs skill)</text>
  <rect class="box" x="30" y="214" width="130" height="106" rx="10"/>
  <text class="name" x="95" y="248">Question</text><text class="sub" x="95" y="268">"why does my</text><text class="sub" x="95" y="284">sound crunch?"</text>
  <rect class="box" x="204" y="214" width="150" height="46" rx="10"/>
  <text class="name" x="279" y="234">Keyword search</text><text class="sub" x="279" y="251">bm25, exact names</text>
  <rect class="box" x="204" y="274" width="150" height="46" rx="10"/>
  <text class="name" x="279" y="294">Vector search</text><text class="sub" x="279" y="311">cosine, everyday words</text>
  <rect class="hub" x="398" y="214" width="150" height="106" rx="10"/>
  <text class="name" x="473" y="250">Merge</text><text class="sub" x="473" y="270">reciprocal rank fusion,</text><text class="sub" x="473" y="286">audience boost,</text><text class="sub" x="473" y="302">top 6 chunks</text>
  <rect class="box" x="592" y="214" width="138" height="106" rx="10"/>
  <text class="name" x="661" y="250">Model</text><text class="sub" x="661" y="270">answers from the</text><text class="sub" x="661" y="286">chunks, links the</text><text class="sub" x="661" y="302">pages it used</text>
  <path class="link" d="M160 267 H176 V237 H196"/><path class="head" d="M204 237 l-10 -6 v12 z"/>
  <path class="link" d="M160 267 H176 V297 H196"/><path class="head" d="M204 297 l-10 -6 v12 z"/>
  <path class="link" d="M354 237 H376 V267 H390"/><path class="head" d="M398 267 l-10 -6 v12 z"/>
  <path class="link" d="M354 297 H376 V267"/>
  <path class="link" d="M548 267 H584"/><path class="head" d="M592 267 l-10 -6 v12 z"/>
</svg>
