<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="t d">
  <title id="t">Two contracts, two numbers</title>
  <desc id="d">A plugin talks to the engine through the IEngine contract. The engine talks to a module through the module ABI. A plugin never talks to a module directly.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .sep { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { font-size: 18px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 13px; fill: var(--muted); text-anchor: middle; }
    .l { text-anchor: start; }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--line); stroke-width: 2; fill: none; }
    .head { fill: var(--accent); }
    .cap { font-size: 13px; font-weight: 600; text-anchor: middle; }
  </style>
  <rect width="760" height="170" rx="14" fill="var(--bg)"/>

  <rect class="box" x="24" y="56" width="170" height="70" rx="12"/>
  <text class="name" x="109" y="97">Plugin</text>
  <rect class="hub" x="295" y="56" width="170" height="70" rx="12"/>
  <text class="name" x="380" y="97">Engine</text>
  <rect class="box" x="566" y="56" width="170" height="70" rx="12"/>
  <text class="name" x="651" y="97">Module</text>

  <path class="link" d="M202 91 H287"/><path class="head" d="M295 91 l-10 -6 v12 z"/>
  <text class="cap" x="248" y="44">IEngine</text>
  <text class="sub" x="248" y="150">engine-abi</text>

  <path class="link" d="M473 91 H558"/><path class="head" d="M566 91 l-10 -6 v12 z"/>
  <text class="cap" x="519" y="44">module ABI</text>
  <text class="sub" x="519" y="150">module-abi</text>
</svg>
