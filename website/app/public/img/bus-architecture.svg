<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" role="img" aria-labelledby="t d">
  <title id="t">Bleep Bus architecture</title>
  <desc id="d">Plugin instances in different tracks, processes or threads each register an endpoint in one shared-memory segment. The segment holds a header and tables of endpoints, inputs and outputs. There is no server process.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; --warn:#b4570a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; --warn:#f0a050; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .name { font-size: 16px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
    .cap { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .capa { font-size: 12.5px; font-weight: 600; text-anchor: middle; fill: var(--accent); }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .head { fill: var(--accent); }
    .on { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .cur { fill: var(--card); stroke: var(--warn); stroke-width: 2.5; }
  </style>
  <rect width="760" height="376" rx="14" fill="var(--bg)"/>

  <rect class="hub" x="24" y="196" width="712" height="62" rx="12"/>
  <text class="name" x="380" y="222">Shared-memory segment</text>
  <text class="sub" x="380" y="242">/bleepbus-v0-default · 17 187 072 bytes · mode 0600</text>

  <rect class="box" x="24" y="30" width="190" height="112" rx="12"/>
  <text class="name" x="119" y="54">Plugin A</text>
  <text class="sub" x="119" y="72">Live track 1</text>
  <rect class="on" x="40" y="86" width="158" height="22" rx="6"/><text class="cap" x="119" y="101">output "LFO"</text>
  <rect class="box" x="40" y="112" width="158" height="22" rx="6"/><text class="cap" x="119" y="127">input "Cutoff"</text>

  <rect class="box" x="285" y="30" width="190" height="112" rx="12"/>
  <text class="name" x="380" y="54">Plugin B</text>
  <text class="sub" x="380" y="72">Live track 2, any thread order</text>
  <rect class="on" x="301" y="86" width="158" height="22" rx="6"/><text class="cap" x="380" y="101">output "Env"</text>
  <rect class="box" x="301" y="112" width="158" height="22" rx="6"/><text class="cap" x="380" y="127">input "Rate"</text>

  <rect class="box" x="546" y="30" width="190" height="112" rx="12"/>
  <text class="name" x="641" y="54">Patchbay or tool</text>
  <text class="sub" x="641" y="72">non-real-time</text>
  <rect class="box" x="562" y="86" width="158" height="22" rx="6"/><text class="cap" x="641" y="101">edits cables</text>
  <rect class="box" x="562" y="112" width="158" height="22" rx="6"/><text class="cap" x="641" y="127">bb_conformance inspect</text>

  <path class="link" d="M119 142 V188"/><path class="head" d="M119 196 l-6 -10 h12 z"/><path class="link" d="M380 142 V188"/><path class="head" d="M380 196 l-6 -10 h12 z"/><path class="link" d="M641 142 V188"/><path class="head" d="M641 196 l-6 -10 h12 z"/>
  <text class="sub" x="160" y="172" style="text-anchor:start">publish / read</text>
  <text class="sub" x="420" y="172" style="text-anchor:start">publish / read</text>
  <text class="sub" x="652" y="172" style="text-anchor:start">registry lock</text>

  <rect class="box" x="24" y="280" width="148" height="52" rx="10"/><text class="cap" x="98" y="303">Endpoint table</text><text class="sub" x="98" y="320">64 plugin instances</text>
  <rect class="box" x="188" y="280" width="148" height="52" rx="10"/><text class="cap" x="262" y="303">Input table</text><text class="sub" x="262" y="320">512, up to 8 cables each</text>
  <rect class="box" x="352" y="280" width="148" height="52" rx="10"/><text class="cap" x="426" y="303">Output table</text><text class="sub" x="426" y="320">256, 4 block slots each</text>
  <rect class="box" x="516" y="280" width="220" height="52" rx="10"/><text class="cap" x="626" y="303">Header</text><text class="sub" x="626" y="320">version, counters, generations</text>
  <path class="thin" d="M380 258 V280"/>
  <text class="sub" x="380" y="360">The segment holds all state. There is no server process and no sockets.</text>
</svg>
