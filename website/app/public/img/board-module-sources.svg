<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-labelledby="t d">
  <title id="t">Where modules come from</title>
  <desc id="d">Modules reach the module host from the Bleep Library, from local files, or from a Code node compiled in the browser. All three pass the same checks before loading, then the host compiles a module when its node type is first used and runs one instance per node.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; --warn:#b4570a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; --warn:#f0a050; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .grp { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { font-size: 16px; font-weight: 650; text-anchor: middle; }
    .lay { font-size: 14px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
    .cap { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .capa { font-size: 12.5px; font-weight: 600; text-anchor: middle; fill: var(--accent); }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .head { fill: var(--accent); }
    .warn { fill: var(--card); stroke: var(--warn); stroke-width: 2; }
  </style>
  <rect width="760" height="366" rx="14" fill="var(--bg)"/>
<rect class="box" x="24" y="40" width="200" height="70" rx="12"/><text class="name" x="124" y="68">Bleep Library</text><text class="sub" x="124" y="88">signed .bleepmod packages</text><text class="sub" x="124" y="104">installed in the Library section</text><rect class="box" x="24" y="130" width="200" height="70" rx="12"/><text class="name" x="124" y="158">Local files</text><text class="sub" x="124" y="178">.bleepmod, or .wasm and .json</text><text class="sub" x="124" y="194">in the data folder</text><rect class="box" x="24" y="220" width="200" height="70" rx="12"/><text class="name" x="124" y="248">Code node</text><text class="sub" x="124" y="268">Bleep Script, compiled</text><text class="sub" x="124" y="284">to .wasm in the browser</text><rect class="hub" x="300" y="40" width="170" height="250" rx="14"/><text class="name" x="385" y="66">Checks</text><rect class="box" x="316" y="84" width="138" height="26" rx="7"/><text class="cap" x="385" y="102">signature and trust</text><rect class="box" x="316" y="118" width="138" height="26" rx="7"/><text class="cap" x="385" y="136">allowed imports only</text><rect class="box" x="316" y="152" width="138" height="26" rx="7"/><text class="cap" x="385" y="170">ABI version in range</text><rect class="box" x="316" y="186" width="138" height="26" rx="7"/><text class="cap" x="385" y="204">memory and time limits</text><text class="sub" x="385" y="234">Library packages and local</text><text class="sub" x="385" y="250">files are signed or need</text><text class="sub" x="385" y="266">"Allow unsigned modules".</text><text class="sub" x="385" y="282">Code nodes: sandbox only.</text><path class="link" d="M224 75 H292"/><path class="head" d="M300 75 l-10 -6 v12 z"/><path class="link" d="M224 165 H292"/><path class="head" d="M300 165 l-10 -6 v12 z"/><path class="link" d="M224 255 H292"/><path class="head" d="M300 255 l-10 -6 v12 z"/><rect class="box" x="546" y="40" width="190" height="250" rx="14"/><text class="name" x="641" y="66">Module host</text><text class="sub" x="641" y="88">compiled when a node of</text><text class="sub" x="641" y="104">its type is first used</text><rect class="box" x="562" y="122" width="158" height="30" rx="7"/><text class="cap" x="641" y="142">one instance per node</text><rect class="box" x="562" y="160" width="158" height="30" rx="7"/><text class="cap" x="641" y="180">its own memory</text><rect class="box" x="562" y="198" width="158" height="30" rx="7"/><text class="cap" x="641" y="218">no files, clock or network</text><text class="sub" x="641" y="254">runs on the audio thread</text><text class="sub" x="641" y="270">in 32-sample chunks</text><path class="link" d="M470 165 H538"/><path class="head" d="M546 165 l-10 -6 v12 z"/><text class="sub" x="380" y="330">Bleep Play fetches from the library on first use. A plugin in Live never downloads: it uses what the app or</text><text class="sub" x="380" y="348">the plugin window installed. Bundled modules are a build option that skips this path.</text></svg>
