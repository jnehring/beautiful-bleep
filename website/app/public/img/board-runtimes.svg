<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="t d">
  <title id="t">One board, three runtimes</title>
  <desc id="d">The Bleep plugins in Live, the Bleep App and Bleep Play each run a board UI, an engine and a module host. All three load the same standalone wasm module files. Bridges connect the plugins to the app by shared memory and the app to the browser by WebSocket.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; --warn:#b4570a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; --warn:#f0a050; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .grp { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { font-size: 16px; font-weight: 650; text-anchor: middle; }
    .lay { font-size: 14px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
    .cap { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .capa { font-size: 12.5px; font-weight: 600; text-anchor: middle; fill: var(--accent); }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .head { fill: var(--accent); }
    .warn { fill: var(--card); stroke: var(--warn); stroke-width: 2; }
  </style>
  <rect width="760" height="410" rx="14" fill="var(--bg)"/>
<rect class="grp" x="24" y="76" width="224" height="182" rx="14"/><text class="name" x="136" y="100">Bleep plugins in Live</text><rect class="box" x="38" y="114" width="196" height="40" rx="8"/><text class="lay" x="136" y="131">Board UI</text><text class="sub" x="136" y="147">HTML and JavaScript</text><rect class="hub" x="38" y="160" width="196" height="40" rx="8"/><text class="lay" x="136" y="177">Engine</text><text class="sub" x="136" y="193">C++, one engine per Live set</text><rect class="box" x="38" y="206" width="196" height="40" rx="8"/><text class="lay" x="136" y="223">Module host</text><text class="sub" x="136" y="239">Wasmtime</text><rect class="grp" x="268" y="76" width="224" height="182" rx="14"/><text class="name" x="380" y="100">Bleep App</text><rect class="box" x="282" y="114" width="196" height="40" rx="8"/><text class="lay" x="380" y="131">Board UI</text><text class="sub" x="380" y="147">HTML and JavaScript</text><rect class="hub" x="282" y="160" width="196" height="40" rx="8"/><text class="lay" x="380" y="177">Engine</text><text class="sub" x="380" y="193">C++, same engine code</text><rect class="box" x="282" y="206" width="196" height="40" rx="8"/><text class="lay" x="380" y="223">Module host</text><text class="sub" x="380" y="239">Wasmtime</text><rect class="grp" x="512" y="76" width="224" height="182" rx="14"/><text class="name" x="624" y="100">Bleep Play (browser)</text><rect class="box" x="526" y="114" width="196" height="40" rx="8"/><text class="lay" x="624" y="131">Board UI</text><text class="sub" x="624" y="147">HTML and JavaScript</text><rect class="hub" x="526" y="160" width="196" height="40" rx="8"/><text class="lay" x="624" y="177">Engine</text><text class="sub" x="624" y="193">JavaScript port</text><rect class="box" x="526" y="206" width="196" height="40" rx="8"/><text class="lay" x="624" y="223">Module host</text><text class="sub" x="624" y="239">WebAssembly, in the worklet</text><path class="link" d="M144 62 H368"/><path class="head" d="M136 62 l10 -6 v12 z"/><path class="head" d="M376 62 l-10 -6 v12 z"/><text class="capa" x="256" y="44">shared memory, sample-locked</text><path class="link" d="M388 62 H612"/><path class="head" d="M380 62 l10 -6 v12 z"/><path class="head" d="M620 62 l-10 -6 v12 z"/><text class="capa" x="500" y="44">WebSocket on 127.0.0.1</text><path class="thin" d="M136 62 V76"/><path class="thin" d="M380 62 V76"/><path class="thin" d="M624 62 V76"/><rect class="box" x="24" y="310" width="712" height="56" rx="12"/><text class="name" x="380" y="334">Modules: one standalone .wasm file per module</text><text class="sub" x="380" y="354">the same files in all three places; the contract is the Module ABI</text><path class="link" d="M136 310 V266"/><path class="head" d="M136 258 l-6 10 h12 z"/><path class="link" d="M380 310 V266"/><path class="head" d="M380 258 l-6 10 h12 z"/><path class="link" d="M624 310 V266"/><path class="head" d="M624 258 l-6 10 h12 z"/><text class="sub" x="380" y="24"></text><text class="sub" x="380" y="392">Plugins, app and browser run the same board; bridges connect them. The Bleep Bus is a separate protocol and not shown.</text></svg>
