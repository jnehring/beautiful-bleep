<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" role="img" aria-labelledby="t d">
  <title id="t">Bleep Bus signal flow</title>
  <desc id="d">A sender writes a block into an output slot. Cables multiply it by an amount and sum them into an input. The receiver reads it one block later and applies the sum to a parameter.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; --warn:#b4570a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; --warn:#f0a050; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .name { font-size: 16px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12.5px; fill: var(--muted); text-anchor: middle; }
    .cap { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    .capa { font-size: 12.5px; font-weight: 600; text-anchor: middle; fill: var(--accent); }
    .link { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .head { fill: var(--accent); }
    .on { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .cur { fill: var(--card); stroke: var(--warn); stroke-width: 2.5; }
  </style>
  <rect width="760" height="298" rx="14" fill="var(--bg)"/>
<rect class="box" x="24" y="50" width="150" height="66" rx="10"/><text class="name" x="99.0" y="76">Sender</text><text class="sub" x="99.0" y="95">bb_write_output</text><path class="link" d="M182 83 H214"/><path class="head" d="M222 83 l-10 -6 v12 z"/><rect class="hub" x="222" y="50" width="160" height="66" rx="10"/><text class="name" x="302.0" y="76">Output slot</text><text class="sub" x="302.0" y="95">one of 4 per output</text><path class="link" d="M390 83 H422"/><path class="head" d="M430 83 l-10 -6 v12 z"/><rect class="box" x="430" y="50" width="150" height="66" rx="10"/><text class="name" x="505.0" y="76">Cable</text><text class="sub" x="505.0" y="95">sample × amount</text><path class="link" d="M588 83 H620"/><path class="head" d="M628 83 l-10 -6 v12 z"/><rect class="box" x="628" y="50" width="108" height="66" rx="10"/><text class="name" x="682.0" y="76">Input</text><text class="sub" x="682.0" y="95">sum of up to 8</text>
  <text class="capa" x="99" y="36">block N</text>
  <text class="capa" x="302" y="36">written under seqlock</text>
  <text class="capa" x="505" y="36">found by UID + name</text>
  <text class="sub" x="380" y="150">The receiver reads in block N+1 what the sender wrote in block N: one block of latency.</text>
  <rect class="box" x="24" y="176" width="712" height="104" rx="12"/>
  <text class="name" x="380" y="202">What the receiver does with the sum</text>
  <text class="sub" x="380" y="226">effective = clamp(knob + Σ source × amount, 0, 1)</text>
  <text class="sub" x="380" y="248">applied inside the plugin's DSP; the host-visible parameter never moves</text>
  <text class="sub" x="380" y="268">non-finite samples and amounts count as 0</text>
</svg>
