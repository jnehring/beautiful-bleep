<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
  <title id="t">Architecture of the patch assistant</title>
  <desc id="d">The chat panel in the board sends the message history and a snapshot of the board to the website API. The API checks sign-in, rate and the daily token budget, and streams events back. It calls the bleep-agent library, which runs the agent loop, the skills and tools, the patch model and the documentation search. The library calls an LLM provider and reads generated data files: the module catalog, the example patches and the documentation index.</desc>
  <style>
    :root { --bg:#fbfaf7; --fg:#1b1d22; --muted:#646b78; --card:#ffffff; --line:#cfcdc6; --accent:#0f9488; --tint:#e3f4f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --fg:#e7e9ee; --muted:#9aa1b1; --card:#1d2027; --line:#3a404d; --accent:#4fd1c5; --tint:#1c3a38; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .group { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 5; }
    .gt { font-size: 14px; font-weight: 700; }
    .box { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .hub { fill: var(--tint); stroke: var(--accent); stroke-width: 2; }
    .name { font-size: 14px; font-weight: 650; text-anchor: middle; }
    .sub { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .cap { font-size: 12px; font-weight: 600; fill: var(--accent); text-anchor: middle; }
    .link { stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: var(--accent); }
  </style>
  <rect width="760" height="440" rx="14" fill="var(--bg)"/>

  <!-- Browser -->
  <rect class="group" x="16" y="16" width="206" height="300" rx="12"/>
  <text class="gt" x="30" y="40">Browser (the board)</text>
  <rect class="box" x="30" y="56" width="178" height="62" rx="10"/>
  <text class="name" x="119" y="82">Chat panel</text><text class="sub" x="119" y="101">agent-chat.js</text>
  <rect class="box" x="30" y="132" width="178" height="62" rx="10"/>
  <text class="name" x="119" y="158">Board and undo</text><text class="sub" x="119" y="177">applies changesets</text>
  <rect class="box" x="30" y="208" width="178" height="62" rx="10"/>
  <text class="name" x="119" y="234">Live tools</text><text class="sub" x="119" y="253">probe, play, highlight, ask</text>
  <text class="sub" x="119" y="296">stateless: sends history + board</text>

  <!-- API -->
  <rect class="group" x="270" y="16" width="190" height="300" rx="12"/>
  <text class="gt" x="284" y="40">Website API (FastAPI)</text>
  <rect class="box" x="284" y="56" width="162" height="50" rx="10"/>
  <text class="name" x="365" y="78">Sign-in, rate limit</text><text class="sub" x="365" y="96">per user per minute</text>
  <rect class="box" x="284" y="118" width="162" height="50" rx="10"/>
  <text class="name" x="365" y="140">Daily token budget</text><text class="sub" x="365" y="158">429 when used up</text>
  <rect class="box" x="284" y="180" width="162" height="50" rx="10"/>
  <text class="name" x="365" y="202">SSE stream</text><text class="sub" x="365" y="220">events to the board</text>
  <rect class="box" x="284" y="242" width="162" height="50" rx="10"/>
  <text class="name" x="365" y="264">Run log</text><text class="sub" x="365" y="282">every call, for debugging</text>

  <!-- Library -->
  <rect class="group" x="508" y="16" width="236" height="300" rx="12"/>
  <text class="gt" x="522" y="40">bleep-agent library</text>
  <rect class="hub" x="522" y="56" width="208" height="54" rx="10"/>
  <text class="name" x="626" y="79">Agent loop</text><text class="sub" x="626" y="98">Pydantic AI, runner.py</text>
  <rect class="box" x="522" y="122" width="208" height="54" rx="10"/>
  <text class="name" x="626" y="145">Skills and tools</text><text class="sub" x="626" y="164">6 skills, read / write / live</text>
  <rect class="box" x="522" y="188" width="208" height="54" rx="10"/>
  <text class="name" x="626" y="211">Patch model and ops</text><text class="sub" x="626" y="230">validated edits, changesets</text>
  <rect class="box" x="522" y="254" width="208" height="46" rx="10"/>
  <text class="name" x="626" y="274">Documentation search</text><text class="sub" x="626" y="291">keyword + embeddings</text>

  <!-- arrows browser <-> API -->
  <path class="link" d="M222 112 H262"/><path class="head" d="M270 112 l-10 -6 v12 z"/>
  <text class="cap" x="246" y="102">POST</text>
  <path class="link" d="M270 210 H230"/><path class="head" d="M222 210 l10 -6 v12 z"/>
  <text class="cap" x="246" y="200">SSE</text>
  <!-- arrow API -> library -->
  <path class="link" d="M460 160 H500"/><path class="head" d="M508 160 l-10 -6 v12 z"/>
  <path class="link" d="M508 232 H468"/><path class="head" d="M460 232 l10 -6 v12 z"/>

  <!-- bottom: provider and data -->
  <rect class="box" x="508" y="352" width="110" height="64" rx="10"/>
  <text class="name" x="563" y="379">LLM provider</text><text class="sub" x="563" y="398">Gemini, OpenAI</text>
  <rect class="box" x="634" y="352" width="110" height="64" rx="10"/>
  <text class="name" x="689" y="379">Built data</text><text class="sub" x="689" y="398">catalog, docs index</text>
  <path class="link" d="M563 316 V344"/><path class="head" d="M563 352 l-6 -10 h12 z"/>
  <path class="link" d="M689 352 V324"/><path class="head" d="M689 316 l-6 10 h12 z"/>
</svg>
