# SPDX-License-Identifier: MIT
#
# The Bleep Patch website: static files behind Caddy, plus the accounts API and its database.
#
#   cp website/.env.example website/.env      # then set the passwords
#   docker compose -f website/docker-compose.yml --env-file website/.env up --build -d
#   open http://localhost:8080                (BLEEP_SITE_PORT=… to change)
#
# Later this stack moves into the Brilliant Bleep site's Compose stack.
# Own project name: the folder name "website" collides with the Brilliant Bleep site.
name: bleep-patch-site

services:
  site:
    build:
      context: ..
      dockerfile: website/Dockerfile
    image: bleep-patch-site:latest
    ports:
      - "${BLEEP_SITE_PORT:-8080}:80"
    depends_on:
      - api
      - storage
    restart: unless-stopped

  api:
    build: api
    image: bleep-patch-api:latest
    environment:
      BLEEP_DATABASE_URL: postgresql+psycopg://bleep:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in website/.env}@db:5432/bleep
      # Secure cookies need HTTPS. Plain http://localhost needs false; set true behind TLS.
      BLEEP_COOKIE_SECURE: ${BLEEP_COOKIE_SECURE:-false}
      BLEEP_ADMIN_EMAIL: ${BLEEP_ADMIN_EMAIL:-}
      BLEEP_ADMIN_PASSWORD: ${BLEEP_ADMIN_PASSWORD:-}
      # Preset files are written to the registry bucket (S3 API).
      BLEEP_S3_ENDPOINT: http://storage:8333
      BLEEP_S3_BUCKET: ${BLEEP_REGISTRY_BUCKET:-bleep-registry}
      BLEEP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bleep}
      BLEEP_S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in website/.env}
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bleep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in website/.env}
      POSTGRES_DB: bleep
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bleep -d bleep"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Object storage for the registry (SeaweedFS, S3 API): plugin and module releases, preset files.
  # Anonymous clients may read (Caddy serves it at /registry/); writing needs the credentials
  # (scripts/release.py through the S3 port below, the API for presets).
  storage:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [
          {"name": "admin", "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
           "actions": ["Admin", "Read", "Write", "List", "Tagging"]},
          {"name": "anonymous", "actions": ["Read"]}]}
        EOF
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bleep}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in website/.env}
    ports:
      # Localhost only: the release script uploads here.
      - "127.0.0.1:${BLEEP_S3_PORT:-8333}:8333"
    volumes:
      - registry-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8333/ ; [ $$? -le 8 ]"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the bucket once per start (idempotent).
  storage-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      storage:
        condition: service_healthy
    environment:
      BUCKET: ${BLEEP_REGISTRY_BUCKET:-bleep-registry}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - echo "s3.bucket.create -name $$BUCKET" | weed shell -master=storage:9333

volumes:
  db-data:
  registry-data:
